{% extends 'base.html' %}

{% block content %}
<div class="delete-container">
    <h1>Eliminar Equipo</h1>

    <p>¿Estás seguro de que quieres eliminar el equipo?</p>

    <span class="delete-team-name">{{ team.name }}</span>

    <hr class="delete-divider">

    <div class="delete-actions">
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Sí, eliminar</button>
        </form>

        <a href="{% url 'team_detail' team.id %}" class="btn-secondary">Cancelar</a>
    </div>
</div>

{% endblock %}
