{% extends 'base.html' %}

{% block content %}
<div class="edit-container">
    <h1>Eliminar torneo</h1>

    <p>
        ¿Estás seguro de que deseas eliminar el torneo
        <strong>{{ tournament.name }}</strong>?
    </p>

    <form class="edit-form" method="POST">
        {% csrf_token %}

        <div class="edit-actions">
            <button type="submit" class="btn-primary">Sí, eliminar</button>
            <a href="{% url 'tournament_detail' tournament.id %}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
