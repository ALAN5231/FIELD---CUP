{% extends 'base.html' %}

{% block content %}
<div class="add-member-container">
    <h2>Agregar árbitro a {{ tournament.name }}</h2>

    {% if error %}
        <div class="form-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="add-member-form">
        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username del árbitro"
            required
        >

        <div class="add-member-actions">
            <button type="submit">
                Agregar árbitro
            </button>

            <a href="{% url 'tournament_detail' tournament.id %}"
               class="btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
